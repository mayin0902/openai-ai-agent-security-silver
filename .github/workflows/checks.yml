name: Offline submission checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build single-file submission
        run: python scripts/build_submission.py
      - name: Verify provenance and candidate structure
        run: python -m unittest discover -s tests -v
